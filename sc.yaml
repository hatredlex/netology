apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage-sc
  namespace: hw-kube-stor
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-local-sc
  namespace: hw-kube-stor
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage-sc
  hostPath:
    path: /data/sc-task

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-local-sc
  namespace: hw-kube-stor
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage-sc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
  namespace: hw-kube-stor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - >
              while true; do
                date >> /data/sc/data.txt;
                sleep 5;
              done
          volumeMounts:
            - name: pvc-volume
              mountPath: /data/sc
        - name: multitool
          image: wbitt/network-multitool:latest
          command: ["/bin/sh", "-c"]
          args:
            - >
              tail -f /data/sc/data.txt
          volumeMounts:
            - name: pvc-volume
              mountPath: /data/sc
      volumes:
        - name: pvc-volume
          persistentVolumeClaim:
            claimName: pvc-local-sc
