apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  namespace: hw-kube-conf
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - k8s.guskovcloud.ru
      secretName: tls-secret
  rules:
    - host: k8s.guskovcloud.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app-svc
                port:
                  number: 80
